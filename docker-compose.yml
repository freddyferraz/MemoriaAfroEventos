# Sobe API + Postgres localmente: docker compose up --build  (http://localhost:8080)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: techflow_eventos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    volumes: [dbdata:/var/lib/postgresql/data]
  api:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=techflow_eventos;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?defina no .env}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:?defina no .env}
      Seed__AdminSenha: ${SEED_ADMIN_SENHA:?defina no .env}
      Seed__EventosDemo: "true"
      App__BaseUrl: ${APP_BASE_URL:-http://localhost:8080}
      Email__Brevo__ApiKey: ${BREVO_API_KEY:-}
      Email__RemetenteEmail: ${EMAIL_REMETENTE:-}
volumes:
  dbdata:
