<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divulgar evento — Conecta Cultura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-pagina="divulgar.html">
  <header id="site-header" class="site-header"></header>

  <div class="container page-heading" style="text-align:center;max-width:680px;margin:0 auto">
    <h1>Divulgar evento</h1>
    <p class="page-subtitle">Para organizadores e moradores. O evento entra na agenda depois da aprovação de um moderador.</p>
  </div>

  <div class="container" style="max-width:860px;padding-bottom:72px">
    <div class="form-panel" id="painel">
      <form id="form-evento" novalidate>
        <div class="form-grid">
          <div class="form-field"><label for="e-tipo">Quem está enviando</label>
            <select id="e-tipo"><option value="1">Morador</option><option value="2">Organizador</option></select></div>
          <div class="form-field"><label for="e-titulo">Nome do evento *</label><input type="text" id="e-titulo" maxlength="200" required /></div>
          <div class="form-field"><label for="e-categoria">Categoria *</label><select id="e-categoria" required></select></div>
          <div class="form-field"><label for="e-cidade">Cidade *</label><input type="text" id="e-cidade" list="lista-cidades" maxlength="120" required />
            <datalist id="lista-cidades"></datalist></div>
          <div class="form-field"><label for="e-data">Data *</label><input type="date" id="e-data" required /></div>
          <div class="form-field"><label for="e-horario">Horário *</label><input type="time" id="e-horario" required /></div>
          <div class="form-field cheio"><label for="e-endereco">Endereço *</label><input type="text" id="e-endereco" maxlength="300" required /></div>
          <div class="form-field cheio"><label for="e-mapa">Link do Google Maps (opcional)</label><input type="url" id="e-mapa" placeholder="Permite filtrar o evento por distância" />
            <div class="form-hint">Abra o local no Google Maps e copie o link do pin.</div></div>
          <div class="form-field cheio"><label for="e-atracoes">Atrações</label><textarea id="e-atracoes" maxlength="2000" style="min-height:80px"></textarea></div>
          <div class="form-field cheio"><label for="e-foto">Foto do evento (opcional)</label>
            <input type="file" id="e-foto" accept="image/jpeg,image/png,image/webp" />
            <div class="form-hint">JPEG, PNG ou WebP. A imagem é reduzida automaticamente antes do envio (máximo de 2 MB).</div>
            <img id="foto-previa" class="foto-previa" alt="Prévia da foto escolhida" hidden /></div>
          <div class="form-field"><label for="e-preco">Preço em reais (0 para gratuito)</label><input type="number" id="e-preco" min="0" step="0.01" value="0" /></div>
          <div class="form-field"><label for="e-ingressos">Ingressos ou inscrição</label><input type="text" id="e-ingressos" maxlength="500" /></div>
          <div class="form-field"><label for="e-acessibilidade">Acessibilidade</label><input type="text" id="e-acessibilidade" maxlength="500" /></div>
          <div class="form-field"><label for="e-organizador">Organizador *</label><input type="text" id="e-organizador" maxlength="200" required /></div>
          <div class="form-field"><label for="e-fonte">Fonte oficial (site ou perfil)</label><input type="text" id="e-fonte" maxlength="500" /></div>
          <div class="form-field"><label for="e-contato">Seu contato para o moderador *</label><input type="text" id="e-contato" maxlength="200" placeholder="E-mail ou telefone" required />
            <div class="form-hint">Não aparece publicamente.</div></div>
        </div>
        <p class="erro-form" id="erro" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block" id="btn-enviar">Enviar para aprovação</button>
      </form>
    </div>
  </div>

  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/shared.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/divulgar.js"></script>
</body>
</html>
