<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja — Conecta Cultura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/newsletter.css" />
  <link rel="stylesheet" href="css/modulos.css" />
  <link rel="stylesheet" href="css/loja.css" />
</head>
<body data-pagina="loja.html">
  <header id="site-header" class="site-header"></header>
  <div class="page-heading">
    <h1>Loja local</h1>
    <p class="page-subtitle">Produtos de artistas, artesãos, produtores e empreendedores da região. Qualquer pessoa pode ver; para comprar ou anunciar é preciso ter conta.</p>
  </div>
  <div class="container" style="padding-bottom:72px">
    <p style="text-align:center;margin:0 0 20px"><a class="btn btn-primary" href="anunciar-produto.html">Anunciar meu produto</a></p>
    <form class="filtros" id="filtros" role="search">
      <div class="form-field"><label for="f-q">Buscar</label><input type="search" id="f-q" placeholder="Produto ou vendedor" /></div>
      <div class="form-field"><label for="f-categoria">Categoria</label><select id="f-categoria"><option value="">Todas</option></select></div>
      <div class="form-field"><label for="f-cidade">Cidade</label><select id="f-cidade"><option value="">Todas</option></select></div>
      <div class="form-field"><label for="f-preco">Preço máximo (R$)</label><input type="number" id="f-preco" min="0" step="5" placeholder="Qualquer" /></div>
      <div class="form-field"><label for="f-ordem">Ordenar</label><select id="f-ordem"><option value="">Mais recentes</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option></select></div>
    </form>
    <p id="contagem" class="ev-meta" aria-live="polite"></p>
    <div class="prod-grid" id="resultados"></div>
  </div>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/shared.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/loja-comum.js"></script>
  <script src="js/loja.js"></script>
</body>
</html>
