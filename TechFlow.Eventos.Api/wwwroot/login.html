<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Coonecta Cultura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-pagina="login.html">
  <header id="site-header" class="site-header"></header>
  <div class="page-heading"><h1>Entrar</h1><p class="page-subtitle">Acesso para moderadores e administradores.</p></div>
  <div class="container" style="max-width:440px;padding-bottom:72px">
    <form class="form-panel" id="form-login">
      <div class="form-field"><label for="l-email">E-mail</label><input type="email" id="l-email" autocomplete="username" required /></div>
      <div class="form-field"><label for="l-senha">Senha</label><input type="password" id="l-senha" autocomplete="current-password" required /></div>
      <p class="erro-form" id="erro" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="btn-entrar">Entrar</button>
    </form>
  </div>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/shared.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
